<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- BM-03A "Grille": 5×5 perforation grid, true 7×7 pitch. The message
       left through the rightmost middle perforation — one brass dot,
       escaped toward the broker. -->
  <g fill="#8A9096">
    <circle cx="5.5" cy="10" r="2.1"/><circle cx="12.5" cy="10" r="2.1"/><circle cx="19.5" cy="10" r="2.1"/><circle cx="26.5" cy="10" r="2.1"/><circle cx="33.5" cy="10" r="2.1"/>
    <circle cx="5.5" cy="17" r="2.1"/><circle cx="12.5" cy="17" r="2.1"/><circle cx="19.5" cy="17" r="2.1"/><circle cx="26.5" cy="17" r="2.1"/><circle cx="33.5" cy="17" r="2.1"/>
    <circle cx="5.5" cy="24" r="2.1"/><circle cx="12.5" cy="24" r="2.1"/><circle cx="19.5" cy="24" r="2.1"/><circle cx="26.5" cy="24" r="2.1"/>
    <circle cx="5.5" cy="31" r="2.1"/><circle cx="12.5" cy="31" r="2.1"/><circle cx="19.5" cy="31" r="2.1"/><circle cx="26.5" cy="31" r="2.1"/><circle cx="33.5" cy="31" r="2.1"/>
    <circle cx="5.5" cy="38" r="2.1"/><circle cx="12.5" cy="38" r="2.1"/><circle cx="19.5" cy="38" r="2.1"/><circle cx="26.5" cy="38" r="2.1"/><circle cx="33.5" cy="38" r="2.1"/>
  </g>
  <circle cx="44" cy="24" r="2.9" fill="#B3925A"/>
</svg>
