      <circle cx="0" cy="0" r="1.4" fill="#8E959B" fill-opacity="0.22"/>
      <circle cx="28" cy="0" r="1.4" fill="#8E959B" fill-opacity="0.22"/>
      <circle cx="0" cy="28" r="1.4" fill="#8E959B" fill-opacity="0.22"/>
      <circle cx="28" cy="28" r="1.4" fill="#8E959B" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="#1B1D1F"/>
  <rect width="1200" height="320" fill="url(#matrix)"/>
  <!-- the empty perforation is emptier than the background: mask its texture dot -->
  <circle cx="479" cy="160" r="4.2" fill="#1B1D1F"/>
  <g transform="translate(185,0)">
