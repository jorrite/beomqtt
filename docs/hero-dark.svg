    <circle cx="70" cy="160" r="6.3"/><circle cx="98" cy="160" r="6.3"/><circle cx="126" cy="160" r="6.3"/><circle cx="154" cy="160" r="6.3"/><circle cx="182" cy="160" r="6.3"/><circle cx="210" cy="160" r="6.3"/><circle cx="238" cy="160" r="6.3"/><circle cx="266" cy="160" r="6.3"/>
