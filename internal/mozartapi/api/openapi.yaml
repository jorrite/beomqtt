components:
  parameters:
    ListeningModeID:
      explode: false
      in: path
      name: id
      required: true
      schema:
        $ref: '#/components/schemas/ListeningModeID'
      style: simple
  responses:
    BeolinkJoinResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BeolinkJoinRequest'
      description: |
        Join started

        Joining always happens asynchronously, use the `requestID` field in
        the response to match your request with a
        `WebsocketEventBeolinkJoinResult` web socket event.
    MissingListeningMode:
      description: No such listening mode
  schemas:
    Action:
      description: |
        An action object. Examples:

        RadioAction:
        ```json
        {
          "type": "radio",
          "radioStationId": "8779112938791514"
        }
        ```

        ToneAction:
        ```json
        {
          "type": "tone",
          "toneName": "alarm_2"
        }
        ```

        SourcePresetAction:
        ```json
        {
          "type": "sourcePreset",
          "source": {
            "value": "spotify"
          },
          "presetKey": "Preset3"
        }
        ```

        DeezerFlowAction:
        ```json
        {
          "type": "deezerFlow",
          "deezerUserId": "1234"
        }
        ```

        ActivateSourceAction:
        ```json
        {
          "type": "activateSource",
          "source": {
            "value": "spotify"
          }
        }
        ```

        PlayQueueAction:
        ```
          {
            "type": "playQueue",
            "queueItem": {
              "provider": {
                "value": "deezer"
              },
              "startNowFromPosition": 0,
              "type": "playlist",
              "uri": "playlist:8074581462"
            },
            "queueSettings": {
              "consume": false,
              "repeat": "none",
              "shuffle": false
            }
          }
        ```

        StandbyAction:
        ```json
        {
          "type": "standby"
        }
        ```

        AllStandbyAction:
        ```json
        {
          "type": "allStandby"
        }
        ```

        TouchToJoinAction:
        ```json
        {
          "type": "touchToJoin"
        }
        ```

        ButtonShortPressAction:
        ```json
        {
          "type": "buttonShortPress",
          "buttonName": "preset1"
        }
        ```

        FallbackAction:
        ```json
        {
          "type": "fallback"
        }
        ```

        VolumeAction:
        ```json
        {
          "type": "volume",
          "volumeLevel": 25
        }
        ```

        StopAction:
        ```json
        {
          "type": "stop",
          "stopDuration": 1300
        }
        ```

        TriggerContentAction:
        ```json
        {
          "contentId": "tv://netflix",
          "type": "triggerContent"
        }
        ```

        SpeakerGroupAction:
        ```json
        {
          "type": "speakerGroup",
          "speakerGroupId": "00112233-4455-6677-8899-aabbccddeeff"
        }
        ```

        ListeningModeAction:
        ```json
        {
          "type": "listeningMode",
          "listeningModeId": 1234
        }
        ```

        StandAction:
        ```json
        {
          "type": "stand",
          "standPosition": {
            "angle": 7.5
          }
        }
        ```

        GainAction:
        ```json
        {
          "type": "sourceGain",
          "source": {
            "value": "spotify"
          },
          "gainDb": 1.0
        }
        ```

        SoundProfileAction:
        ```json
        {
          "type": "soundProfile",
          "soundProfile": {
            "speakerId1": {
              "directivity": "wide"
            },
            "speakerId2": {
              "directivity": "narrow"
            }
          }
        }
        ```
      properties:
        buttonName:
          description: Name of the Button used for button-press types ('buttonShortPress')
          enum:
          - preset1
          - preset2
          - preset3
          - preset4
          nullable: true
          type: string
        contentId:
          description: Id of content only used for 'type=triggerContent'
          nullable: true
          type: string
        deezerUserId:
          description: Id of user only used for 'type=deezerFlow' and is optional
          nullable: true
          pattern: "^\\d{10}$"
          type: string
        gainDb:
          description: Only used for 'type=sourceGain'
          maximum: 12
          minimum: -12
          type: number
        listeningModeId:
          format: int32
          minimum: 0
          type: integer
        presetKey:
          description: Only used for 'type=sourcePreset'
          nullable: true
          pattern: "^Preset[0-9]+$"
          type: string
        queueItem:
          $ref: '#/components/schemas/PlayQueueItem'
        queueSettings:
          $ref: '#/components/schemas/PlayQueueSettings'
        radioStationId:
          description: Id of RadioStation only used for 'type=radio'
          nullable: true
          pattern: "^\\d{16}$"
          type: string
        soundProfile:
          additionalProperties:
            $ref: '#/components/schemas/ActionSoundProfile'
          description: Only used for 'type=soundProfile'
          example:
            speakerId1:
              directivity: directivity1
            speakerId2:
              directivity: directivity1
          nullable: true
          type: object
        source:
          $ref: '#/components/schemas/SourceTypeEnum'
        speakerGroupId:
          format: uuid
          type: string
        standPosition:
          $ref: '#/components/schemas/StandPosition'
        stopDuration:
          description: The duration to wait (seconds) until stopping only used for
            'type=stop'
          format: int32
          minimum: 0
          nullable: true
          type: integer
        toneName:
          description: Name of the tone only used for 'type=tone'
          enum:
          - alarm_1
          - alarm_2
          nullable: true
          type: string
        type:
          description: The type of Action
          enum:
          - standby
          - tone
          - radio
          - sourcePreset
          - deezerFlow
          - activateSource
          - playQueue
          - buttonShortPress
          - allStandby
          - touchToJoin
          - fallback
          - volume
          - stop
          - triggerContent
          - speakerGroup
          - listeningMode
          - stand
          - sourceGain
          - soundProfile
          type: string
        volumeLevel:
          description: The volume level to configure only used for 'type=volume'
          format: int32
          maximum: 100
          minimum: 0
          nullable: true
          type: integer
      required:
      - type
      type: object
    ActionList:
      description: An ordered list of Actions to run on the product
      example:
      - type: volume
        volumeLevel: 35
      - radioStationId: "8779112938791514"
        type: radio
      - stopDuration: 1300
        type: stop
      items:
        $ref: '#/components/schemas/Action'
      type: array
    ActionSoundProfile:
      properties:
        directivity:
          nullable: true
          type: string
      type: object
    AdvancedBeamforming:
